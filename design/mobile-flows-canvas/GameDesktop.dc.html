<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Albion Online silver</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bz.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="page {{theme}}">
  <header class="top">
    <div class="wrap">
      <a class="logo" href="HomeDesktop.dc.html" aria-label="Bullizard home"><svg class="eye" viewBox="0 0 72 64" aria-hidden="true"><path d="M4 8C14 31 58 31 68 8C56 22 16 22 4 8Z" fill="currentColor"></path><circle cx="36" cy="41" r="16" fill="none" stroke="currentColor" stroke-width="6"></circle><path d="M36 30.5C39.2 35.5 39.2 46.5 36 51.5C32.8 46.5 32.8 35.5 36 30.5Z" fill="currentColor"></path></svg><svg class="wm-svg" viewBox="-45 -925 4682 945" aria-hidden="true"><g fill="currentColor" transform="scale(1 -1)"><path transform="translate(0 0)" d="M403 701Q486 701 546.0 679.0Q606 657 639.0 617.5Q672 578 672 524Q672 471 640.0 430.0Q608 389 553 373Q618 359 656.0 311.0Q694 263 694 196Q694 136 660.0 92.0Q626 48 564.5 24.0Q503 0 418 0H59V701ZM392 426Q422 426 440.5 442.5Q459 459 459 487Q459 515 440.5 530.0Q422 545 392 545H266V426ZM392 156Q431 155 455.0 173.0Q479 191 479 222Q479 250 455.0 267.0Q431 284 392 283H266V168L249 74L302 156Z"></path><path d="M-25 905C60 625 692 625 777 905C680 715 72 715 -25 905Z"></path><path transform="translate(720 0)" d="M248 256Q248 216 268.0 192.5Q288 169 321 169Q360 170 382.5 199.0Q405 228 405 275H451Q451 185 425.0 122.0Q399 59 351.5 25.0Q304 -9 238 -9Q181 -9 137.5 17.0Q94 43 70.0 89.5Q46 136 46 199V544H248ZM405 544H607V0H405Z"></path><path transform="translate(1388 0)" d="M66 742H268V0H66Z"></path><path transform="translate(1723 0)" d="M66 742H268V0H66Z"></path><path transform="translate(2058 0)" d="M61 544H263V0H61ZM163 803Q209 803 238.0 773.5Q267 744 267 699Q267 653 238.0 624.0Q209 595 163 595Q118 595 88.5 624.0Q59 653 59 699Q59 744 88.5 773.5Q118 803 163 803Z"></path><path transform="translate(2382 0)" d="M39 544 527 543V424L283 151H537V0H29V119L273 392H39Z"></path><path transform="translate(2944 0)" d="M271 228Q241 228 225.5 215.5Q210 203 210 177Q210 152 226.0 137.5Q242 123 271 123Q292 123 310.0 130.0Q328 137 342.0 149.5Q356 162 363 179L388 107Q368 52 321.0 21.5Q274 -9 204 -9Q146 -9 105.0 12.5Q64 34 42.0 72.5Q20 111 20 162Q20 241 74.0 283.5Q128 326 230 327H381V228ZM363 329Q363 363 339.0 382.0Q315 401 269 401Q236 401 193.0 391.0Q150 381 105 362L55 496Q100 514 144.0 527.0Q188 540 231.5 546.0Q275 552 317 552Q432 552 496.5 500.0Q561 448 561 353V0H363Z"></path><path transform="translate(3551 0)" d="M434 370Q382 377 343.5 365.0Q305 353 284.0 326.5Q263 300 263 260L217 269Q217 356 243.5 420.0Q270 484 319.0 518.0Q368 552 434 552ZM61 544H263V0H61Z"></path><path transform="translate(3995 0)" d="M266 551Q333 551 381.0 517.0Q429 483 456.0 421.0Q483 359 483 274Q483 188 457.0 125.0Q431 62 383.5 27.5Q336 -7 271 -7Q195 -7 138.5 27.5Q82 62 50.5 126.0Q19 190 19 275Q19 359 49.5 420.5Q80 482 136.0 516.5Q192 551 266 551ZM322 391Q292 391 269.5 376.0Q247 361 235.0 333.5Q223 306 223 270Q223 233 235.0 206.0Q247 179 269.5 163.5Q292 148 322 148Q352 148 374.0 163.5Q396 179 408.0 206.0Q420 233 420 270Q420 306 408.0 333.5Q396 361 374.0 376.0Q352 391 322 391ZM420 742H622V0H420Z"></path></g></svg></a>
      <label class="search" for="gq">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="gq" placeholder="Search games, currency or items" style="border: 0; outline: 0; background: transparent; flex: 1; font: inherit; color: var(--ink);">
      </label>
      <nav style="display: flex; align-items: center; gap: 20px; margin-inline-start: auto;">
        <a class="navlink" href="#">Sell</a>
        <button class="pill">USD</button>
        <button class="pill" lang="ar">العربية</button>
        <a class="btn sm" href="#" style="padding: 0 16px;">Sign in</a>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding-block: 32px 64px; display: flex; flex-direction: column; gap: 24px;">
    <nav class="small muted" aria-label="Breadcrumb"><a href="HomeDesktop.dc.html" style="color: var(--steel);">Games</a> / Albion Online</nav>
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;">
      <h1 class="h1" style="font-size: 40px;">Albion Online</h1>
      <div class="seg" role="group" aria-label="Server">
        <sc-for list="{{servers}}" as="s" hint-placeholder-count="3"><button class="{{s.cls}}" onClick="{{s.pick}}">{{s.name}}</button></sc-for>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <a class="on" href="#" role="tab" aria-selected="true">Silver</a>
      <a href="#" role="tab">Gold</a>
      <a href="#" role="tab">Items</a>
    </div>

    <div style="display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap;">
      <aside class="side" style="width: 240px; flex: 1 1 240px; max-width: 280px;">
        <div class="card" style="gap: 8px;">
          <label for="amt" style="font: 600 14px/1.3 var(--font-body);">How much silver?</label>
          <div style="display: flex; align-items: center; gap: 8px;">
            <input id="amt" class="input mono" type="number" min="1" value="{{amtRaw}}" onChange="{{setAmt}}" style="flex: 1;">
            <span class="mono" style="font-weight: 600;">M</span>
          </div>
        </div>
        <div>
          <h3 class="h3">Delivery</h3>
          <label class="opt"><input type="radio" name="d">Up to 15 min</label>
          <label class="opt"><input type="radio" name="d" checked>Up to 1 hour</label>
          <label class="opt"><input type="radio" name="d">Any time</label>
        </div>
        <div>
          <h3 class="h3">Seller</h3>
          <label class="opt"><input type="checkbox" checked>Online now</label>
          <label class="opt"><input type="checkbox">Fang rank or higher</label>
          <label class="opt"><input type="checkbox">Founding sellers</label>
        </div>
      </aside>

      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
        <div class="row" style="padding-bottom: 8px;">
          <span class="small muted">{{count}} offers on {{server}}</span>
          <label class="small" style="display: flex; align-items: center; gap: 8px;">Sort
            <select class="pill" style="height: 36px;"><option>Lowest price</option><option>Fastest delivery</option><option>Best rated</option></select>
          </label>
        </div>
        <div class="lhead label"><span>Seller</span><span class="hide-sm">Rating</span><span class="hide-sm">Stock</span><span class="hide-sm" style="text-align: end;">Per 1M</span><span style="text-align: end;">{{amt}}M total</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <article class="listing">
            <div style="display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap;">
              <span class="avatar">{{r.ini}}</span>
              <b style="font-size: 15px;">{{r.name}}</b>
              <span class="{{r.rankCls}}">
                <sc-if value="{{r.egg}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4 0 7 6 7 11a7 7 0 0 1-14 0c0-5 3-11 7-11z"></path><path d="M8 12.5l2 1.5 1.5-2 2 2 2-1.5"></path></svg></sc-if>
                <sc-if value="{{r.scale}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c4.5 2 7 5.5 7 9.5c0 4.2-3.2 7.3-7 8.5c-3.8-1.2-7-4.3-7-8.5c0-4 2.5-7.5 7-9.5z"></path><path d="M12 7.5v9"></path><path d="M8.5 11.5l3.5 2 3.5-2"></path></svg></sc-if>
                <sc-if value="{{r.fang}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18"></path><path d="M6 5c.2 4 1.4 7.5 4 10c-.7-3.2-.4-6.8 1-10"></path><path d="M18 5c-.2 4-1.4 7.5-4 10c.7-3.2.4-6.8-1-10"></path></svg></sc-if>
                <sc-if value="{{r.basilisk}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13C5 8.5 8.5 6.5 12 6.5s7 2 9.5 6.5c-2.5 4.5-6 6.5-9.5 6.5S5 17.5 2.5 13Z"></path><path d="M12 9.5c1 1.2 1 5.8 0 7c-1-1.2-1-5.8 0-7Z" fill="currentColor"></path><path d="M7 4.5l2 1.5 3-2.5 3 2.5 2-1.5"></path></svg></sc-if>
                <sc-if value="{{r.dragon}}" hint-placeholder-val="{{false}}"><svg width="16" height="14" viewBox="0 0 72 64" fill="var(--rune)" aria-hidden="true"><path d="M4 8C14 31 58 31 68 8C56 22 16 22 4 8Z"></path><circle cx="36" cy="41" r="16" fill="none" stroke="var(--rune)" stroke-width="6"></circle><path d="M36 30.5C39.2 35.5 39.2 46.5 36 51.5C32.8 46.5 32.8 35.5 36 30.5Z"></path></svg></sc-if>
                {{r.rank}}
              </span>
              <sc-if value="{{r.founding}}" hint-placeholder-val="{{false}}"><span class="rank"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--ink)"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="var(--paper)" stroke-width="2"></circle></svg>Founding</span></sc-if>
              <span class="small muted" style="flex-basis: 100%; padding-inline-start: 42px;">~{{r.eta}}</span>
            </div>
            <div class="small hide-sm"><span class="mono">★ {{r.rating}}</span> <span class="muted">({{r.reviews}})</span></div>
            <div class="mono small hide-sm">{{r.stock}}</div>
            <div class="mono hide-sm" style="text-align: end;">{{r.unit}}</div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
              <span class="price" style="font-size: 17px;">{{r.total}}</span>
              <a class="btn sm buy" href="Main.dc.html" style="padding: 0 16px;">Buy</a>
            </div>
          </article>
        </sc-for>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1360}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { server: 'Europe', amt: '30' }; }
  renderVals() {
    const amt = Math.max(1, parseFloat(this.state.amt) || 1);
    const data = [
      { name: 'RedTower', ini: 'RT', rank: 'Hatchling', key: 'egg', founding: true, rating: 'new', reviews: '3 orders', stock: '90M', unit: 0.989, eta: '45 min', where: 'Caerleon market' },
      { name: 'NorthWind', ini: 'NW', rank: 'Fang', key: 'fang', founding: true, rating: '4.90', reviews: '190', stock: '820M', unit: 1 / 0.95, eta: '30 min', where: 'Caerleon market' },
      { name: 'KaelForge', ini: 'KF', rank: 'Scale', key: 'scale', founding: false, rating: '4.81', reviews: '64', stock: '240M', unit: 1.069, eta: '15 min', where: 'Any royal city' },
      { name: 'Mistwalker', ini: 'MW', rank: 'Basilisk', key: 'basilisk', founding: false, rating: '4.92', reviews: '402', stock: '1.4B', unit: 1.074, eta: '20 min', where: 'Fort Sterling' },
      { name: 'Caerleon Traders', ini: 'CT', rank: 'Dragon', key: 'dragon', founding: true, rating: '4.97', reviews: '812', stock: '2.1B', unit: 1.112, eta: '10 min', where: 'Caerleon market' }
    ];
    return {
      theme: this.props.dark ? 'night' : 'frost',
      server: this.state.server,
      amtRaw: this.state.amt,
      amt: String(amt),
      count: { Americas: '41', Europe: '57', Asia: '23' }[this.state.server],
      setAmt: (e) => this.setState({ amt: e.target.value }),
      servers: ['Americas', 'Europe', 'Asia'].map((n) => ({ name: n, cls: n === this.state.server ? 'on' : '', pick: () => this.setState({ server: n }) })),
      rows: data.map((r) => Object.assign({}, r, {
        rankCls: r.key === 'dragon' ? 'rank top' : 'rank',
        egg: r.key === 'egg', scale: r.key === 'scale', fang: r.key === 'fang', basilisk: r.key === 'basilisk', dragon: r.key === 'dragon',
        unit: '$' + r.unit.toFixed(3),
        total: '$' + (Math.ceil(r.unit * amt * 100) / 100).toFixed(2)
      }))
    };
  }
}
</script>
</body>
</html>
