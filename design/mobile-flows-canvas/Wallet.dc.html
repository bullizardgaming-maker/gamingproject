<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet and withdraw</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bz.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone {{theme}}" style="width: 390px; height: 940px;">
  <div class="bar">
    <h1 style="padding-left: 4px;">Wallet</h1>
    <button class="btn ghost sm">History</button>
  </div>
  <div class="body">
    <div class="card" style="gap: 16px;">
      <div>
        <p class="label">Available to withdraw</p>
        <div class="price-lg" style="margin-top: 6px;">$248.40</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <div style="background: var(--held-soft); color: var(--held-ink); border-radius: var(--radius-md); padding: 10px 12px;">
          <div class="small">In escrow</div><div class="mono" style="font-weight: 600;">$96.20</div>
        </div>
        <div style="background: var(--released-soft); color: var(--released-ink); border-radius: var(--radius-md); padding: 10px 12px;">
          <div class="small">Releasing tomorrow</div><div class="mono" style="font-weight: 600;">$30.00</div>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="label">Withdraw</p>
      <div class="field">
        <label for="amt">Amount (USD)</label>
        <input id="amt" class="input mono" type="number" step="0.01" min="0" value="{{amtRaw}}" onChange="{{setAmt}}">
      </div>
      <div class="seg"><button onClick="{{set25}}">$25</button><button onClick="{{set100}}">$100</button><button onClick="{{setMax}}">Max</button></div>
      <div class="rows">
        <div class="row"><span class="muted">Fee (6%)</span><span class="mono">− {{fee}}</span></div>
        <div class="row total"><span>You get</span><span class="price">{{net}}</span></div>
      </div>
    </div>

    <div class="card">
      <div class="row"><p class="label">Send to</p><button class="linkbtn" style="color: var(--ink);">Change</button></div>
      <div class="row" style="background: var(--raised); border-radius: var(--radius-md); padding: 10px 12px;">
        <div style="min-width: 0;">
          <div class="small" style="font-weight: 600;">USDT · TRC-20</div>
          <div class="mono small" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">[YOUR SAVED PAYOUT ADDRESS]</div>
        </div>
      </div>
      <label class="check"><input type="checkbox"><span>I checked this address.</span></label>
    </div>
  </div>
  <div class="sticky">
    <button class="btn">Withdraw {{net}}</button>
    <div class="small muted" style="text-align: center;">Arrives in about 3 days</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amt: '100.00' }; }
  renderVals() {
    const a = Math.min(248.4, Math.max(0, parseFloat(this.state.amt) || 0));
    const fee = a > 0 ? Math.max(1.5, Math.round(a * 0.06 * 100) / 100) : 0;
    const net = Math.max(0, a - fee);
    const usd = (n) => '$' + n.toFixed(2);
    return {
      theme: this.props.dark ? 'night' : 'frost',
      amtRaw: this.state.amt,
      fee: usd(fee),
      net: usd(net),
      setAmt: (e) => this.setState({ amt: e.target.value }),
      set25: () => this.setState({ amt: '25.00' }),
      set100: () => this.setState({ amt: '100.00' }),
      setMax: () => this.setState({ amt: '248.40' })
    };
  }
}
</script>
</body>
</html>
