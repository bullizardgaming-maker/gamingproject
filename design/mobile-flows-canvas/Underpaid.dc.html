<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout: underpayment</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bz.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone {{theme}}" style="width: 390px; height: 900px;">
  <div class="bar">
    <a class="iconbtn" href="Pay.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1>Top up to finish</h1>
  </div>
  <div class="body" style="gap: 16px;">
    <div class="card" style="gap: 14px;">
      <h2 class="h2" style="font-size: 20px;">Send 3.58 USDT more to start your order.</h2>
      <div class="rows">
        <div class="row"><span class="muted">Order total</span><span class="mono">31.58 USDT</span></div>
        <div class="row"><span class="muted">Received</span><span class="mono">28.00 USDT</span></div>
        <div class="row total"><span>Still to send</span><span class="price">3.58 USDT</span></div>
      </div>
      <span class="small muted">The 28.00 USDT is safe in your balance.</span>
    </div>

    <div class="card" style="flex-direction: row; gap: 16px; align-items: center;">
      <div class="qr" role="img" aria-label="Top-up QR code" style="width: 112px; height: 112px; flex: none;">
        <svg width="88" height="88" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM1 1v1h1V1zM5 1v1h1V1zM1 5v1h1V5zM4 4h1v1H4zM6 4h1v2H6zM4 6h2v1H4zM5 5h1v1H5zM3 3h1v1H3zM3 0h1v1H3zM3 5h1v2H3z"></path></svg>
      </div>
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px;">
        <span class="small muted">Send 3.58 USDT on TRC-20</span>
        <span class="mono small" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">[Same deposit address]</span>
        <button class="btn ghost sm" style="align-self: flex-start;">Copy address</button>
      </div>
    </div>

    <a href="#" class="small" style="color: var(--ink);">Why is it short?</a>
  </div>
  <div class="sticky">
    <a class="btn" href="OrderBuyer.dc.html">I've sent the rest</a>
    <a class="btn ghost" href="Wallet.dc.html" style="height: 44px;">Keep it in my balance</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.dark ? 'night' : 'frost' }; }
}
</script>
</body>
</html>
