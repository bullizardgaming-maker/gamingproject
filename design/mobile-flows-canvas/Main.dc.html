<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout: confirm and pay</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bz.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone {{theme}}" style="width: 390px; height: 900px;">
  <div class="bar">
    <button class="iconbtn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <h1>Checkout</h1>
    <span class="chip">USD</span>
  </div>
  <div class="body">
    <div class="card" style="flex-direction: row; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 10px; background: var(--raised); display: grid; place-items: center; font: 700 13px/1 var(--font-mono); color: var(--steel); flex: none;">AO</div>
      <div style="min-width: 0; flex: 1;">
        <p class="label">Albion Online · Silver · Europe</p>
        <div class="h3">30M Silver</div>
        <div class="small muted">NorthWind · ~20 min</div>
      </div>
    </div>

    <div class="card">
      <div class="row"><p class="label">Deliver to</p><button class="linkbtn" style="color: var(--ink);">Change</button></div>
      <div class="saved">
        <div class="avatar">K</div>
        <div style="flex: 1; min-width: 0;">
          <div style="font: 600 17px/1.2 var(--font-mono);">Kaelthar</div>
          <div class="small muted">Europe</div>
        </div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
      </div>
      <label class="check"><input type="checkbox" checked><span>This is my exact character name.</span></label>
    </div>

    <div class="card">
      <div class="rows">
        <div class="row"><span class="muted">30M × $1.053 / 1M</span><span class="mono">$31.58</span></div>
        <div class="row total"><span>You pay</span><span class="price">$31.58</span></div>
      </div>
    </div>

    <div class="note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
      <span>Held until you confirm delivery.</span>
    </div>
  </div>
  <div class="sticky">
    <a class="btn buy" href="Pay.dc.html">Pay $31.58 with crypto</a>
    <div class="small muted" style="text-align: center;">By paying you accept the <a href="#" style="color: var(--ink);">trading rules</a>.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'night' : 'frost' };
  }
}
</script>
</body>
</html>
