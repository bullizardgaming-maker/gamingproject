<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1080,"height":1080}}'>

  renderVals() {
    return {
      theme: (this.props.dark ?? true) ? 'night' : 'frost',
      games: ['Aion', 'Aion 2', 'Albion Online', 'Path of Exile', 'Path of Exile 2']
    };
  }
}
</script>
