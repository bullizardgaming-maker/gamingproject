<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sell form with buyer-price preview</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bz.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="phone {{theme}}" style="width: 390px; height: 1320px;">
  <div class="bar">
    <button class="iconbtn" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    <h1>New listing</h1>
    <span class="chip ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Rules test</span>
  </div>
  <div class="body">
    <div class="note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><path d="M14 10h4M14 14h3"></path></svg>
      <span>Verify your ID within 23 days. <a href="#" style="color: var(--ink);">Verify</a></span>
    </div>

    <div class="card">
      <div class="field"><p class="label">Game</p>
        <div class="seg"><button>Aion 2</button><button class="on">Albion Online</button><button>Path of Exile 2</button><button>More</button></div>
      </div>
      <div class="field"><p class="label">Category</p>
        <div class="seg"><button class="on">Silver</button><button>Items</button><button>Top-up</button></div>
      </div>
      <div class="field"><p class="label">Server</p>
        <div class="seg"><button>Americas</button><button>Asia</button><button class="on">Europe</button></div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="price">Your price per 1M silver (USD)</label>
        <input id="price" class="input mono" type="number" step="0.001" min="0" value="{{priceRaw}}" onChange="{{setPrice}}">
      </div>
      <div class="field">
        <label for="stock">Silver in stock</label>
        <input id="stock" class="input mono" type="text" value="500M">
      </div>
      <div class="field">
        <label for="eta">Delivery time</label>
        <input id="eta" class="input" type="text" value="Within 30 minutes">
      </div>
    </div>

    <div class="card">
      <div class="row"><p class="label">Preview per 1M</p>
        <div class="seg" role="group" aria-label="Currency"><sc-for list="{{curs}}" as="c" hint-placeholder-count="3"><button class="{{c.cls}}" onClick="{{c.pick}}">{{c.code}}</button></sc-for></div>
      </div>
      <div class="rows">
        <div class="row"><span>Buyer pays</span><span class="price">{{buyerLocal}}</span></div>
        <div class="row"><span>You earn</span><span class="price">{{keepLocal}}</span></div>
      </div>
      <a href="#" class="small" style="color: var(--steel);">How fees work</a>
    </div>

    <div class="field">
      <label for="desc">Notes for buyers</label>
      <textarea id="desc" class="input" style="height: 80px; padding: 12px 14px; font-size: 15px; line-height: 1.4;">Face-to-face trade in Caerleon. Online 10:00–02:00 CET.</textarea>
      <span class="small muted">No outside contacts.</span>
    </div>
  </div>
  <div class="sticky">
    <button class="btn">Publish listing</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { price: '1.000', cur: 'USD' }; }
  renderVals() {
    const p = Math.max(0, parseFloat(this.state.price) || 0);
    const buyer = p / (1 - 0.05);
    const keep = p;
    const sym = { USD: '$', EUR: '€', EGP: 'E£' }[this.state.cur];
    const rate = { USD: 1, EUR: 0.92, EGP: 48.5 }[this.state.cur];
    const dp = this.state.cur === 'EGP' ? 2 : 3;
    return {
      theme: this.props.dark ? 'night' : 'frost',
      priceRaw: this.state.price,
      buyerLocal: sym + (buyer * rate).toFixed(dp),
      keepLocal: sym + (keep * rate).toFixed(dp),
      curs: ['USD', 'EUR', 'EGP'].map((c) => ({ code: c, cls: c === this.state.cur ? 'on' : '', pick: () => this.setState({ cur: c }) })),
      setPrice: (e) => this.setState({ price: e.target.value })
    };
  }
}
</script>
</body>
</html>
