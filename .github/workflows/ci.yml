name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: market, POSTGRES_DB: market_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npx tsc -p sdks/typescript/tsconfig.json --noEmit   # SDK; its tests run in the API suite
      - run: npm test -w apps/api
        env:
          MONEY_FUZZ_RUNS: '40' # money property tests (money-invariants.test.ts): more random scenarios in CI than locally

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/web   # includes the payment-page script inventory check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: VITE_DEMO=true npm run build -w apps/web   # the demo build runs every flow against the in-browser mock
      - run: npm run e2e -w apps/web   # includes axe accessibility scans (e2e/a11y.spec.ts)
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  # Load: a smaller flash sale (correctness + latency budget) and market search over 5,000
  # listings, against the real API over HTTP. Budgets are loose; they catch large regressions.
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: market, POSTGRES_DB: market }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://market:market@localhost:5432/market
      REDIS_URL: redis://localhost:6379
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        working-directory: .
      - run: npm run build && npm run migrate
      - name: Start the API
        run: |
          RATE_LIMIT_PER_MINUTE=10000000 AUTH_RATE_LIMIT_PER_MINUTE=10000000 RUN_WORKER_IN_PROCESS=false LOG_LEVEL=warn node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/readyz && exit 0; sleep 1; done; cat api.log; exit 1
      - run: npm run loadtest
        env: { BUYERS: "300", STOCK: "50", CONCURRENCY: "50", MAX_ORDER_P95_MS: "3000", MAX_PAY_P95_MS: "3000" }
      - run: npm run loadtest:search
        env: { LISTINGS: "5000", REQUESTS: "1000", CONCURRENCY: "20", MAX_SEARCH_P95_MS: "1500" }
      - if: failure()
        run: cat api.log

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The on-chain escrow toolchain (hardhat) is its own install: it is not part of the launch (crypto goes through
      # NOWPayments) and is kept out of the root workspace so the root/api/web audits stay clean.
      - run: npm ci
        working-directory: contracts
      - run: npm test
        working-directory: contracts

  fraud-gnn:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/fraud-gnn } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - run: pytest -q

  sdk-python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.9" }
      - run: pip install pytest
      - run: pytest -q
