name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: market, POSTGRES_DB: market_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npx tsc -p sdks/typescript/tsconfig.json --noEmit   # SDK; its tests run in the API suite
      - run: npm test -w apps/api
        env:
          MONEY_FUZZ_RUNS: '40' # money property tests (money-invariants.test.ts): more random scenarios in CI than locally

  # The production image as Render runs it (Round 23a): build apps/api/Dockerfile, check every package the built
  # code imports resolves inside the image, run the migrations, start node dist/index.js and wait for /readyz.
  api-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: market, POSTGRES_DB: market }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t bullizard-api:ci .
      - name: Runtime imports resolve in the image
        run: docker run --rm -v "$PWD/apps/api/scripts:/app/apps/api/scripts:ro" bullizard-api:ci node scripts/check-runtime-imports.mjs
      - name: Migrate, start and reach /readyz
        run: |
          cat > image.env <<'ENV'
          NODE_ENV=production
          APP_ENV=staging
          DATABASE_URL=postgres://market:market@localhost:5432/market
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=ci-only-jwt-secret-0000000000000000000000
          DATA_ENCRYPTION_KEYS=v1:Y2ktb25seS1kYXRhLWtleS0zMi1ieXRlcy0tLS0tLS0=
          FINGERPRINT_KEY=ci-only-fingerprint-key
          CRYPTO_INDEXER_SECRET=ci-only-indexer-secret
          SANDBOX_MODE=true
          PLATFORM_ACCOUNTS=mock
          MALWARE_SCANNER=dev
          EMAIL_PROVIDER=resend
          RESEND_API_KEY=re_ci_placeholder
          CAPTCHA_PROVIDER=turnstile
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          TURNSTILE_SECRET=1x0000000000000000000000000000000AA
          ORIGIN_SHARED_SECRET=ci-only-origin-secret
          RUN_WORKER_IN_PROCESS=false
          ENV
          docker run --rm --network host --env-file image.env bullizard-api:ci node dist/migrate.js
          docker run -d --name api --network host --env-file image.env bullizard-api:ci
          for i in $(seq 1 40); do
            if curl -sf localhost:4000/readyz; then
              curl -sf localhost:4000/healthz && exit 0
            fi
            sleep 1
          done
          docker logs api; exit 1
      - name: ClamAV image limits (proof videos up to 100 MB)
        run: |
          docker build -t bullizard-clamav:ci services/clamav
          docker run --rm --entrypoint clamconf bullizard-clamav:ci -n > clamconf.txt
          for k in StreamMaxLength MaxScanSize MaxFileSize; do
            v=$(grep -E "^$k = " clamconf.txt | grep -oE '[0-9]+'); echo "$k=$v"
            test "$v" -ge 125829120
          done
      - if: failure()
        run: docker logs api || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/web   # includes the payment-page script inventory check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: VITE_DEMO=true npm run build -w apps/web   # the demo build runs every flow against the in-browser mock
      - run: npm run e2e -w apps/web   # includes axe accessibility scans (e2e/a11y.spec.ts)
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }

  # Load: a smaller flash sale (correctness + latency budget) and market search over 5,000
  # listings, against the real API over HTTP. Budgets are loose; they catch large regressions.
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: market, POSTGRES_PASSWORD: market, POSTGRES_DB: market }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://market:market@localhost:5432/market
      REDIS_URL: redis://localhost:6379
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        working-directory: .
      - run: npm run build && npm run migrate
      - name: Start the API
        run: |
          RATE_LIMIT_PER_MINUTE=10000000 AUTH_RATE_LIMIT_PER_MINUTE=10000000 RUN_WORKER_IN_PROCESS=false LOG_LEVEL=warn node dist/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/readyz && exit 0; sleep 1; done; cat api.log; exit 1
      - run: npm run loadtest
        env: { BUYERS: "300", STOCK: "50", CONCURRENCY: "50", MAX_ORDER_P95_MS: "3000", MAX_PAY_P95_MS: "3000" }
      - run: npm run loadtest:search
        env: { LISTINGS: "5000", REQUESTS: "1000", CONCURRENCY: "20", MAX_SEARCH_P95_MS: "1500" }
      - if: failure()
        run: cat api.log

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The on-chain escrow toolchain (hardhat) is its own install: it is not part of the launch (crypto goes through
      # NOWPayments) and is kept out of the root workspace so the root/api/web audits stay clean.
      - run: npm ci
        working-directory: contracts
      - run: npm test
        working-directory: contracts

  fraud-gnn:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/fraud-gnn } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - run: pytest -q

  sdk-python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdks/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.9" }
      - run: pip install pytest
      - run: pytest -q
