# Staging money paths (apps/api/scripts/money-paths.ts) against https://api-staging.bullizard.com, through Cloudflare.
# Manual: Actions → "staging money paths" → Run workflow. Secrets and Render settings: docs/STAGING.md → "Staging test workflows".
name: staging money paths
on:
  workflow_dispatch:
  # Off for now. To run it daily, uncomment:
  # schedule:
  #   - cron: '23 5 * * *'

permissions:
  contents: read

# One staging test at a time (the kill-switch test pauses the site; the load test must not overlap the others).
concurrency:
  group: staging-tests
  cancel-in-progress: false

jobs:
  money-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/api } }
    env:
      API_URL: https://api-staging.bullizard.com
      STAGING_TEST_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
      BUYER_EMAIL: ${{ secrets.STAGING_BUYER_EMAIL }}
      BUYER_PASSWORD: ${{ secrets.STAGING_BUYER_PASSWORD }}
      SELLER_EMAIL: ${{ secrets.STAGING_SELLER_EMAIL }}
      SELLER_PASSWORD: ${{ secrets.STAGING_SELLER_PASSWORD }}
      STAFF_EMAIL: ${{ secrets.STAGING_STAFF_EMAIL }}
      STAFF_PASSWORD: ${{ secrets.STAGING_STAFF_PASSWORD }}
      STAFF_TOTP_SECRET: ${{ secrets.STAGING_STAFF_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        working-directory: .
      - name: Check the secrets are set (names only)
        run: |
          missing=0
          for v in STAGING_TEST_TOKEN BUYER_EMAIL BUYER_PASSWORD SELLER_EMAIL SELLER_PASSWORD STAFF_EMAIL STAFF_PASSWORD STAFF_TOTP_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; missing=1; fi
          done
          exit $missing
      - run: npx tsx scripts/money-paths.ts
