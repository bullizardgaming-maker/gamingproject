# Staging blueprint for Render (https://render.com/docs/blueprint-spec).
# Round 25: staging runs like production against the NOWPayments SANDBOX (api-sandbox.nowpayments.io, sandbox keys) with
# live Steam/Riot sign-in and mock KYC. SANDBOX_MODE is off (no /v1/sandbox/* routes). Payments use sandbox coins only, so
# nothing here moves real money; never put production NOWPayments keys in this group.
# APP_ENV=staging with NODE_ENV=production: every production check applies (real email through Resend,
# Turnstile, explicit encryption keys) except that there is no ClamAV service (MALWARE_SCANNER=dev).
# Everything runs in Frankfurt, next to the Neon database (eu-central-1); an env group has no region.
# The database is a Neon branch (DATABASE_URL is asked for on first deploy). Setup and the web side
# (Vercel): docs/STAGING.md; host choice and costs: docs/HOSTING.md. Production: render.production.yaml.
envVarGroups:
  - name: bullizard-staging
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: SANDBOX_MODE
        value: "false"
      - key: PAYMENT_PROVIDER
        value: nowpayments # with the sandbox URL and sandbox keys below
      - key: KYC_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "Bullizard <no-reply@mail.bullizard.com>"
      - key: EMAIL_REPLY_TO
        value: support@bullizard.com
      - key: ALERTS_EMAIL
        value: alerts@bullizard.com
      - key: FINANCE_EMAIL
        value: finance@bullizard.com
      - key: SMS_PROVIDER
        value: none # Round 24: no phone anywhere; SMS off (console would print codes to the log)
      - key: MALWARE_SCANNER
        value: dev # no ClamAV on staging (allowed only with APP_ENV=staging); detects the EICAR test file only
      - key: PLATFORM_ACCOUNTS
        value: live # real Steam/Riot sign-in (mock is only allowed with SANDBOX_MODE)
      - key: TRUST_PROXY
        value: "1" # Render's load balancer; behind Cloudflare the client IP is CF-Connecting-IP (ORIGIN_SHARED_SECRET)
      - key: NOWPAYMENTS_API_URL
        value: https://api-sandbox.nowpayments.io # sandbox: keep it on staging
      - key: AUTO_REFUND_LATE_ORDERS
        value: "false"
      - key: CARD_REFUNDS_ENABLED
        value: "false"
      - key: CARD_PAYMENTS_ENABLED
        value: "false" # CFO B10: no $0.50 minimum charge while card payments are off
      - key: PAYOUT_CURRENCIES
        value: "USD" # CFO B12: payouts locked to USD (USDT TRC-20 / BEP-20)
      - key: FX_SPREAD_BPS
        value: "0" # CFO B12: EUR/EGP are display-only approximations
      - key: PAYOUT_HOLD_DAYS_NEW
        value: "1" # CFO B8
      - key: PAYOUT_HOLD_DAYS_ESTABLISHED
        value: "0" # CFO B8
      - key: RECON_TOLERANCE_CENTS
        value: "100" # CFO B7
      - key: PAYOUT_UNKNOWN_REVERSE_HOURS
        value: "6"
      - key: JWT_SECRET
        generateValue: true
      - key: FINGERPRINT_KEY
        generateValue: true
      - key: CRYPTO_INDEXER_SECRET
        generateValue: true
      # "v1:" + 32 random bytes in base64: openssl rand -base64 32 (see docs/STAGING.md)
      - key: DATA_ENCRYPTION_KEYS
        sync: false
      # The staging web origin, e.g. https://staging.example.com (CORS allows only this origin)
      - key: PUBLIC_WEB_URL
        sync: false
      # This API's public URL, e.g. https://api-staging.example.com (payment return links)
      - key: PUBLIC_API_URL
        sync: false
      # Neon: the pooled connection string of the `staging` branch, ending ?sslmode=verify-full
      # (require is also accepted and upgraded to verify-full by the API)
      - key: DATABASE_URL
        sync: false
      # Resend API key (sending access, domain mail.bullizard.com)
      - key: RESEND_API_KEY
        sync: false
      # Cloudflare Turnstile secret for the staging widget (the site key is VITE_TURNSTILE_SITE_KEY on Vercel)
      - key: TURNSTILE_SECRET
        sync: false
      # Same random value as the X-Origin-Auth header Cloudflare adds (Transform Rule): openssl rand -hex 32
      - key: ORIGIN_SHARED_SECRET
        sync: false
      # Brevo newsletter sync (optional; blank = Ops exports a CSV instead)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_LIST_ID_EN
        sync: false
      - key: BREVO_LIST_ID_AR
        sync: false
      # NOWPayments SANDBOX keys (required: PAYMENT_PROVIDER=nowpayments refuses to start without them)
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      # Sandbox account login and 2FA secret, for testing payouts (blank: withdrawals wait for approval and are not sent)
      - key: NOWPAYMENTS_EMAIL
        sync: false
      - key: NOWPAYMENTS_PASSWORD
        sync: false
      - key: NOWPAYMENTS_2FA_SECRET
        sync: false
      # Steam/Riot sign-in (PLATFORM_ACCOUNTS=live). Steam works without a key; Riot linking needs the approved app.
      - key: STEAM_WEB_API_KEY
        sync: false
      - key: RIOT_CLIENT_ID
        sync: false
      - key: RIOT_CLIENT_SECRET
        sync: false
      # Staging test workflows (.github/workflows/staging-*.yml): requests with X-Staging-Test-Token = this value skip
      # Turnstile on sign-in. openssl rand -hex 32, the same value as the GitHub secret STAGING_TEST_TOKEN. Staging only:
      # the API refuses to start with it unless APP_ENV=staging. Blank = scripted sign-ins are refused (Turnstile).
      - key: STAGING_TEST_TOKEN
        sync: false

services:
  - type: web
    name: bullizard-api-staging
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /readyz
    preDeployCommand: node dist/migrate.js
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - fromGroup: bullizard-staging
      # Background jobs run inside the API: one instance, one uploads disk. For more
      # instances, add a worker (node dist/worker.js) and move uploads to S3.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: STORAGE_DIR
        value: /data/uploads
      - key: REDIS_URL
        fromService: { type: keyvalue, name: bullizard-staging-redis, property: connectionString }

  - type: keyvalue
    name: bullizard-staging-redis
    region: frankfurt
    plan: starter
    ipAllowList: [] # private network only
