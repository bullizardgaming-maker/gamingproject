# Bullizard (Round 23b): delivery-proof videos are up to 100 MB. clamd's defaults (StreamMaxLength 100M,
# MaxScanSize 400M, MaxFileSize 100M in the image; 25M in older builds) are raised with headroom, and long
# scans are allowed to finish. The API still fails closed on any error or timeout.
StreamMaxLength 120M
MaxScanSize 120M
MaxFileSize 120M
ReadTimeout 180
CommandReadTimeout 180
