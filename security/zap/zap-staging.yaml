# OWASP ZAP automation plan for staging (launch gate §2: dynamic scan — auth, headers, CSP, CORS, rate limits, uploads).
# Runs from GitHub Actions (workflow staging-zap.yml, manual) or from the repo root once staging is up:
#   STAGING_WEB=https://staging.bullizard.com STAGING_API=https://api-staging.bullizard.com \
#   ZAP_USER=<buyer test account> ZAP_PASS='...' STAGING_TEST_TOKEN='...' \
#   docker run --rm -v "$PWD/security/zap:/zap/wrk:rw" -e STAGING_WEB -e STAGING_API -e ZAP_USER -e ZAP_PASS -e STAGING_TEST_TOKEN \
#     ghcr.io/zaproxy/zaproxy:stable zap.sh -cmd -autorun /zap/wrk/zap-staging.yaml
# Reports land in security/zap/reports/. Exit code 1 on any High alert; 2 when only Medium alerts are left (for triage).
env:
  contexts:
    - name: bullizard-staging
      urls:
        - ${STAGING_WEB}
        - ${STAGING_API}/v1
      includePaths:
        - ${STAGING_WEB}.*
        - ${STAGING_API}/v1.*
      excludePaths:
        # Never touch money-moving or destructive endpoints from a scanner.
        - ${STAGING_API}/v1/payments/.*
        - ${STAGING_API}/v1/admin/.*
        - ${STAGING_API}/v1/me/data/delete.*
        - ${STAGING_API}/v1/auth/logout
        # Paths that send email or SMS (sign-up, reset, codes) or rewrite test data (sandbox helpers).
        - ${STAGING_API}/v1/auth/register
        - ${STAGING_API}/v1/auth/password/.*
        - ${STAGING_API}/v1/verify/.*
        - ${STAGING_API}/v1/sandbox/.*
      authentication:
        method: json
        parameters:
          loginPageUrl: ${STAGING_WEB}/login
          loginRequestUrl: ${STAGING_API}/v1/auth/login
          loginRequestBody: '{"email":"{%username%}","password":"{%password%}"}'
        verification:
          method: response
          loggedInRegex: '"token"'
          loggedOutRegex: '"unauthorized"'
      sessionManagement:
        method: headers
        parameters:
          Authorization: "Bearer {%json:token%}"
      users:
        - name: buyer
          credentials:
            username: ${ZAP_USER}
            password: ${ZAP_PASS}
      technology:
        include: [Db.PostgreSQL, Language.JavaScript, OS.Linux, WS.Nginx]
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Sign-in on staging needs Turnstile; the staging-only STAGING_TEST_TOKEN header skips it (apps/api config.ts refuses
  # the variable outside APP_ENV=staging). Only requests to the staging API carry it.
  - type: replacer
    rules:
      - description: staging test token (Turnstile skip)
        url: ${STAGING_API}/.*
        matchType: req_header
        matchString: X-Staging-Test-Token
        matchRegex: false
        replacementString: ${STAGING_TEST_TOKEN}

  # Seed the API endpoints (there is no public OpenAPI document: Bullizard has no seller API, Round 23c). The web app
  # spiders below find the rest from the pages.
  - type: requestor
    parameters:
      user: buyer
    requests:
      - url: ${STAGING_API}/v1/features
      - url: ${STAGING_API}/v1/auth/config
      - url: ${STAGING_API}/v1/categories
      - url: ${STAGING_API}/v1/games?q=path
      - url: ${STAGING_API}/v1/offers?q=divine&sort=price_asc
      - url: ${STAGING_API}/v1/offers?game=path-of-exile-2&category=currency
      - url: ${STAGING_API}/v1/requests
      - url: ${STAGING_API}/v1/status
      - url: ${STAGING_API}/v1/legal/terms
      - url: ${STAGING_API}/v1/me
      - url: ${STAGING_API}/v1/me/notifications
      - url: ${STAGING_API}/v1/me/wallet
      - url: ${STAGING_API}/v1/orders
      - url: ${STAGING_API}/v1/chat/rooms

  - type: spider
    parameters:
      context: bullizard-staging
      user: buyer
      maxDuration: 10
      maxDepth: 6

  - type: spiderAjax
    parameters:
      context: bullizard-staging
      user: buyer
      maxDuration: 10
      browserId: firefox-headless

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: bullizard-staging
      user: buyer
      policy: bullizard
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 60
      threadPerHost: 4
      delayInMs: 50          # stays under the API's rate limits; 429s are expected and checked by the alerts below
    policyDefinition:
      defaultStrength: medium
      defaultThreshold: medium
      rules:
        - id: 40012   # Cross Site Scripting (Reflected)
          strength: high
        - id: 40014   # Cross Site Scripting (Persistent)
          strength: high
        - id: 40018   # SQL Injection
          strength: high
        - id: 90019   # Server Side Code Injection
          strength: high
        - id: 6       # Path Traversal
          strength: high
        - id: 40009   # Server Side Include
          threshold: high
        - id: 10104   # User Agent Fuzzer (noisy)
          threshold: off

  # What we specifically want checked (headers, CSP, CORS, cookies, rate limits, uploads):
  - type: alertFilter
    alertFilters:
      - ruleId: 10038   # Content Security Policy header not set — the web app sets CSP; the API answers JSON. Keep as Medium.
        newRisk: Info
        url: ${STAGING_API}/v1/.*
        urlRegex: true
      - ruleId: 10021   # X-Content-Type-Options
        newRisk: High
      - ruleId: 10020   # Missing anti-clickjacking header (web only)
        newRisk: High
        url: ${STAGING_WEB}.*
        urlRegex: true
      - ruleId: 10035   # Strict-Transport-Security
        newRisk: High
      - ruleId: 10098   # Cross-Domain Misconfiguration (CORS)
        newRisk: High
      - ruleId: 10054   # Cookie without SameSite
        newRisk: High
      - ruleId: 10010   # Cookie without HttpOnly
        newRisk: High
      - ruleId: 10112   # Session management response identified (expected: bearer tokens)
        newRisk: Info

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: zap-staging-{{yyyy-MM-dd}}.html
      reportTitle: Bullizard staging — ZAP
    risks: [info, low, medium, high]

  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk/reports
      reportFile: zap-staging-{{yyyy-MM-dd}}.sarif
    risks: [medium, high]

  - type: exitStatus
    parameters:
      errorLevel: high      # exit code 1 on any High alert
      warnLevel: medium
