# Production blueprint for Render (https://render.com/docs/blueprint-spec): API (2 GB), a separate worker,
# Redis, ClamAV. Database: Neon `main` branch. Uploads: S3-compatible bucket, so the API can scale to more
# than one instance. Costs and what to fill in: docs/HOSTING.md. Deploy with: render blueprint launch
# --file render.production.yaml (or New → Blueprint and pick this file).
envVarGroups:
  - name: bullizard-production
    envVars:
      - key: NODE_ENV
        value: production
      - key: SANDBOX_MODE
        value: "false"
      - key: PAYMENT_PROVIDER
        value: nowpayments
      - key: KYC_PROVIDER
        value: sumsub
      - key: APP_ENV
        value: production
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: "Bullizard <no-reply@mail.bullizard.com>"
      - key: EMAIL_REPLY_TO
        value: support@bullizard.com
      - key: ALERTS_EMAIL
        value: alerts@bullizard.com
      - key: FINANCE_EMAIL
        value: finance@bullizard.com
      - key: RESEND_API_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false # Cloudflare Turnstile; the site key is VITE_TURNSTILE_SITE_KEY on Vercel
      - key: ORIGIN_SHARED_SECRET
        sync: false # = the X-Origin-Auth value Cloudflare adds; requests without it are refused
      - key: BREVO_API_KEY
        sync: false # newsletter sync; blank = CSV export in Ops
      - key: BREVO_LIST_ID_EN
        sync: false
      - key: BREVO_LIST_ID_AR
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: MALWARE_SCANNER
        value: clamd
      - key: CLAMD_PORT
        value: "3310"
      - key: STORAGE_PROVIDER
        value: s3
      - key: TRUST_PROXY
        value: "1"
      - key: FX_PROVIDER
        value: live
      - key: MERCHANT_API_ENABLED
        value: "false" # hidden at launch (CEO, Oct 23)
      - key: AUTO_REFUND_LATE_ORDERS
        value: "false" # no automatic cancel/refund: staff decide disputes (CEO, Oct 24)
      - key: CARD_REFUNDS_ENABLED
        value: "false" # crypto only at launch: refunds go to the buyer's balance, never to a card
      - key: CARD_PAYMENTS_ENABLED
        value: "false" # CFO B10: no $0.50 minimum charge while card payments are off
      - key: PAYOUT_CURRENCIES
        value: "USD" # CFO B12: payouts locked to USD (USDT TRC-20 / BEP-20)
      - key: FX_SPREAD_BPS
        value: "0" # CFO B12: EUR/EGP are display-only approximations
      - key: PAYOUT_HOLD_DAYS_NEW
        value: "1" # CFO B8
      - key: PAYOUT_HOLD_DAYS_ESTABLISHED
        value: "0" # CFO B8
      - key: RECON_TOLERANCE_CENTS
        value: "100" # CFO B7
      - key: PAYOUT_UNKNOWN_REVERSE_HOURS
        value: "6"
      - key: RECON_INTERVAL_HOURS
        value: "24" # daily ledger reconciliation; mismatches email admins + finance
      - key: JWT_SECRET
        generateValue: true
      - key: FINGERPRINT_KEY
        generateValue: true
      - key: CRYPTO_INDEXER_SECRET
        generateValue: true
      # Keep a copy of this one in a password manager: data encrypted with it can't be read without it.
      - key: DATA_ENCRYPTION_KEYS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false # https://<domain>
      - key: PUBLIC_API_URL
        sync: false # https://api.<domain>
      - key: DATABASE_URL
        sync: false # Neon `main` branch, pooled, ?sslmode=verify-full
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false # e.g. https://<account>.r2.cloudflarestorage.com, or blank for AWS
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_EMAIL
        sync: false
      - key: NOWPAYMENTS_PASSWORD
        sync: false
      - key: NOWPAYMENTS_2FA_SECRET
        sync: false
      - key: SUMSUB_APP_TOKEN
        sync: false
      - key: SUMSUB_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

services:
  - type: web
    name: bullizard-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: standard
    region: frankfurt
    numInstances: 1
    healthCheckPath: /readyz
    preDeployCommand: node dist/migrate.js
    envVars:
      - fromGroup: bullizard-production
      - key: RUN_WORKER_IN_PROCESS
        value: "false" # the worker service below runs the jobs
      - key: REDIS_URL
        fromService: { type: keyvalue, name: bullizard-redis, property: connectionString }
      - key: CLAMD_HOST
        fromService: { type: pserv, name: bullizard-clamav, property: host }

  - type: worker
    name: bullizard-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    plan: starter
    region: frankfurt
    envVars:
      - fromGroup: bullizard-production
      - key: REDIS_URL
        fromService: { type: keyvalue, name: bullizard-redis, property: connectionString }
      - key: CLAMD_HOST
        fromService: { type: pserv, name: bullizard-clamav, property: host }

  - type: pserv
    name: bullizard-clamav
    runtime: image
    region: frankfurt
    image:
      url: docker.io/clamav/clamav:stable
    plan: standard

  - type: keyvalue
    name: bullizard-redis
    region: frankfurt
    plan: standard
    ipAllowList: []
