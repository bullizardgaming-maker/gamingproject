[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bullizard"
version = "0.1.0"
description = "Bullizard seller API client: orders, inventory, prices, chat, invoices, reports and signed webhooks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bullizard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
