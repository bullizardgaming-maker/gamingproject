# Prometheus alerting rules for Bullizard. Scrape each API node's /metrics with
# `Authorization: Bearer $METRICS_TOKEN`. Tune thresholds to real traffic.
groups:
  - name: bullizard-api
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(http_server_errors_total[5m])) / sum(rate(http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations: { summary: "More than 2% of API requests are failing with 5xx" }

      - alert: ApiSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "p95 API latency above 1s" }

  - name: bullizard-money
    rules:
      - alert: ReconciliationMismatch
        expr: max(bullizard_reconciliation_last_status) >= 1
        labels: { severity: page }
        annotations: { summary: "Last money reconciliation found a mismatch or failed. See Operations > Reconciliation." }

      - alert: ReconciliationNotRunning
        expr: max(bullizard_reconciliation_last_run_age_seconds) > 30 * 3600 or max(bullizard_reconciliation_last_run_age_seconds) < 0
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "No reconciliation has finished in the last 30 hours" }

      - alert: ChargebackDeadlineClose
        expr: max(bullizard_chargebacks_due_within_7d) > 0
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "Chargebacks with a response deadline within 7 days have not been submitted" }

  - name: bullizard-operations
    rules:
      - alert: WorkerJobStalled
        expr: max by (job) (bullizard_worker_job_last_success_age_seconds{job!~"reconciliation_scheduler|db_backup|restore_drill"}) > 300
        for: 5m
        labels: { severity: page }
        annotations: { summary: "Background job {{ $labels.job }} hasn't succeeded for 5 minutes (escrow release or emails are stuck)" }

      - alert: DatabaseBackupStale
        expr: max(bullizard_worker_job_last_success_age_seconds{job="db_backup"}) > 26 * 3600 or absent(bullizard_worker_job_last_success_age_seconds{job="db_backup"})
        for: 15m
        labels: { severity: page }
        annotations: { summary: "No successful database base backup in 26 hours (deploy/backup/backup.sh)" }

      - alert: RestoreDrillStale
        expr: max(bullizard_worker_job_last_success_age_seconds{job="restore_drill"}) > 8 * 86400 or absent(bullizard_worker_job_last_success_age_seconds{job="restore_drill"})
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "No passing restore drill in 8 days: backups are unproven (deploy/backup/restore-drill.sh)" }

      - alert: ReplicaLagging
        expr: max(bullizard_db_replica_lag_seconds) > 30 or max(bullizard_db_replica_lag_seconds) == -1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Read replica is lagging or unreachable; search and listings are being served from the primary" }

      - alert: DisputesPilingUp
        expr: max(bullizard_disputes_oldest_open_seconds) > 48 * 3600
        labels: { severity: ticket }
        annotations: { summary: "A dispute has been waiting for an arbiter for more than 48 hours" }

      - alert: PaidOrdersNotDelivered
        expr: max(bullizard_orders_paid_undelivered_1h) > 10
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "More than 10 paid orders are waiting for delivery for over an hour" }

      - alert: EmailsFailing
        expr: max(bullizard_emails{status="failed"}) > 5
        labels: { severity: page }
        annotations: { summary: "Emails are failing to send (password resets and security alerts included)" }

      - alert: FraudReviewBacklog
        expr: max(bullizard_risk_flags_open) > 25
        for: 1h
        labels: { severity: ticket }
        annotations: { summary: "More than 25 fraud flags await review; frozen sellers can't withdraw" }
