# Continuous WAL archiving to object storage via WAL-G.
# Credentials and the bucket come from the WALG_* / AWS_* environment (see deploy/backup/walg.env.example).
wal_level = replica
archive_mode = on
archive_command = '/usr/local/bin/wal-g wal-push %p'
archive_timeout = 60          # ship a WAL segment at least every minute: at most ~1 minute of data at risk
max_wal_senders = 10          # streaming replicas (DATABASE_READ_URL) and pg_basebackup
wal_keep_size = 1GB
hot_standby = on
