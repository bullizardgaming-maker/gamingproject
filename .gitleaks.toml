# Secret scan configuration (launch gate §2). `gitleaks git .` scans the full history; CI runs it on every push.
[extend]
useDefault = true

[allowlist]
description = "Known non-secrets"
regexes = [
  # Public on-chain contract addresses used in tests (USDC/USDT token addresses are not secrets).
  '''ESCROW_TOKEN_USD[CT]: '0x[0-9a-fA-F]{40}'''',
  # Test-only fixed values that look like keys.
  '''ipn-secret-for-tests''',
  '''JBSWY3DPEHPK3PXP''',
]
paths = [
  '''apps/web/public/.*\.(png|webp|svg)$''',
  '''design/.*''',
]
