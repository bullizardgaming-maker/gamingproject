# Local stack: docker compose up --build   (add --profile gnn to run the HGT fraud service)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]

  clamav:
    image: clamav/clamav:stable
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://market:market@postgres:5432/market
      REDIS_URL: redis://redis:6379
      RUN_WORKER_IN_PROCESS: "false"
      PUBLIC_WEB_URL: http://localhost:8080
      TRUST_PROXY: uniquelocal # the web container's nginx, on the private compose network
      MALWARE_SCANNER: clamd
      CLAMD_HOST: clamav
      PLATFORM_ACCOUNTS: live # Steam sign-in needs no key; Riot only with RIOT_CLIENT_ID/SECRET in .env
      STORAGE_DIR: /data/uploads
      # The image runs NODE_ENV=production: Turnstile is required (Cloudflare's always-pass test secret unless .env
      # sets a real one) and email must be resend (EMAIL_PROVIDER=resend + RESEND_API_KEY in .env).
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://market:market@postgres:5432/market
      REDIS_URL: redis://redis:6379
      # Same production checks as the API container.
      MALWARE_SCANNER: clamd
      CLAMD_HOST: clamav
      PLATFORM_ACCOUNTS: live
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}
    depends_on:
      api: { condition: service_started }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

  fraud-gnn:
    profiles: ["gnn"]
    build: services/fraud-gnn
    environment:
      DATABASE_URL: postgres://market:market@postgres:5432/market
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8090:8090"]

volumes:
  pgdata:
  uploads:
